:root{
  --cream:#EEEBDF; --paper:#F6F4EC; --blue:#2B4C8D; --blue-deep:#1B2F5E; --pink:#D2457B; --ink:#14213D;
  --muted:#44506F; --line:rgba(20,33,61,.14);
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.74); --glass-bd:rgba(255,255,255,.75);
  --shadow:0 10px 30px -12px rgba(27,47,94,.45), 0 2px 6px rgba(27,47,94,.08);
  --r:20px;
  --display:'Oswald Variable','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Inter Variable','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:15px/1.45 var(--body);min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1}

/* ---------- poster background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--cream)}
.bg .blue{position:absolute;left:0;top:0;width:100%;height:272px;background:var(--blue)}
.bg .blue::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(238,235,223,.55) 1.1px,transparent 1.5px) 0 0/6px 6px;
  -webkit-mask:linear-gradient(100deg,#000 5%,rgba(0,0,0,.25) 70%);mask:linear-gradient(100deg,#000 5%,rgba(0,0,0,.25) 70%)}
.bg .blue2{position:absolute;right:-6vw;bottom:-4vh;width:min(46vw,640px);height:min(34vh,340px);background:var(--blue)}
.bg .blue2::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(238,235,223,.6) 1.1px,transparent 1.6px) 0 0/6px 6px;
  -webkit-mask:linear-gradient(300deg,#000 5%,transparent 80%);mask:linear-gradient(300deg,#000 5%,transparent 80%)}
.bg .word{position:absolute;right:-4vw;top:30vh;font:700 clamp(150px,30vw,460px)/.8 var(--display);color:var(--pink);transform:rotate(-8deg);text-transform:uppercase;letter-spacing:-.02em;user-select:none}
.bg .dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--blue)}
.bg .dot:nth-of-type(1){left:14px;top:14px}.bg .dot:nth-of-type(2){right:14px;top:14px}
.bg .dot:nth-of-type(3){left:14px;bottom:14px}.bg .dot:nth-of-type(4){right:14px;bottom:14px}
.bg .tag{position:absolute;left:50px;top:15px;font:800 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--cream);display:flex;align-items:center;gap:10px}
.bg .tag i{display:block;width:90px;height:1.5px;background:var(--cream);position:relative}
.bg .tag i::after{content:"";position:absolute;right:0;top:-3px;border:4px solid transparent;border-left:7px solid var(--cream);border-right:0}

/* ---------- glass ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-bd);border-radius:var(--r);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.8)}
.glass.strong{background:var(--glass-strong)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(250,248,242,.92)}}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;padding:44px 28px 40px}
.nav{position:sticky;top:44px;align-self:start;padding:18px 14px;display:flex;flex-direction:column;gap:6px;height:calc(100vh - 88px);max-height:720px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font:700 26px/1 var(--display);text-transform:uppercase}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--blue);color:var(--pink);font-size:22px}
.logo span em{color:var(--pink);font-style:normal}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:11px 12px;border-radius:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.5)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 8px 18px -8px rgba(27,47,94,.7)}
.nav .sp{flex:1}
.nav .note{font-size:12px;color:var(--muted);padding:8px 10px;line-height:1.35}
main{min-width:0;padding-bottom:24px}
.kicker{display:flex;align-items:center;gap:10px;font:800 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:10px}
.head .kicker,.head .kicker a{color:var(--cream)}
.kicker i{display:block;width:44px;height:1.5px;background:currentColor;position:relative}
.kicker i::after{content:"";position:absolute;right:0;top:-3px;border:4px solid transparent;border-left:7px solid currentColor;border-right:0}
.head{margin-bottom:20px}
.head h1{font-size:clamp(38px,6vw,64px);font-weight:700;color:var(--cream);overflow-wrap:anywhere}
.head h1 em{font-style:normal;color:#FF9DBF}
.head .sub{margin-top:10px;color:var(--cream);opacity:.88;font-weight:500}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.card{padding:20px}
.card h2{font-size:22px;color:var(--blue-deep);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h2 small{font:600 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp1{flex:1}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;transition:transform .08s,box-shadow .15s;box-shadow:0 8px 18px -10px rgba(27,47,94,.8)}
.btn:active{transform:scale(.97)}
.btn.pink{background:var(--pink);box-shadow:0 8px 18px -10px rgba(210,69,123,.9)}
.btn.ghost{background:rgba(255,255,255,.55);color:var(--blue-deep);border:1px solid var(--glass-bd);box-shadow:none}
.btn.danger{background:transparent;color:var(--pink);box-shadow:none;border:1px solid rgba(210,69,123,.45)}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:13px}
.btn.big{padding:18px 26px;font:700 22px var(--display);text-transform:uppercase;letter-spacing:.03em;border-radius:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font:700 12px var(--body);background:rgba(255,255,255,.6);border:1px solid var(--glass-bd);white-space:nowrap}
.chip.t-push{background:var(--blue);color:#fff;border-color:transparent}
.chip.t-pull{background:var(--pink);color:#fff;border-color:transparent}
.chip.t-legs{background:var(--ink);color:#fff;border-color:transparent}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid var(--glass-bd);gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:700;font-size:13px;color:var(--blue-deep);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
input[type=number],input[type=text],input[type=date],select{width:100%;background:rgba(255,255,255,.7);border:1px solid var(--glass-bd);border-radius:12px;padding:10px 12px;outline:none;color:var(--ink)}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,76,141,.18)}
label.f{display:block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}

/* ---------- workout editor ---------- */
.ex-card{padding:16px}
.ex-card .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-card h3{font-size:20px;color:var(--blue-deep);letter-spacing:.02em}
.ex-card .last{font-size:12.5px;color:var(--muted);margin:4px 0 12px}
.ex-card .last b{color:var(--ink)}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--pink)}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 42px 26px;gap:8px;align-items:center}
.set .n{font:700 16px var(--display);color:var(--muted);text-align:center}
.set input{font:600 20px var(--display);text-align:center;padding:8px 6px;letter-spacing:.02em}
.set.pre input{color:rgba(20,33,61,.45)}
.set .ok{width:42px;height:42px;border-radius:50%;border:2px solid var(--blue);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.set .ok svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.set.done .ok{background:var(--pink);border-color:var(--pink)}
.set.done .ok svg{opacity:1}
.set .rm{opacity:.5}
.setlabels{display:grid;grid-template-columns:26px 1fr 1fr 42px 26px;gap:8px;font:700 10px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;margin-bottom:6px}
.addset{margin-top:10px;width:100%}
.sticky-bar{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom));z-index:5;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
.prog{height:8px;border-radius:99px;background:rgba(20,33,61,.12);overflow:hidden;min-width:24px;flex:1}
.cnt{min-width:52px;font:700 18px var(--display)}
.sticky-bar .btn{padding:11px 16px;white-space:nowrap}
.prog i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .25s}

/* ---------- today dashboard ---------- */
.plan{padding:26px;position:relative;overflow:hidden;background:var(--glass-strong)}
.plan .big-t{font:700 clamp(34px,5vw,52px)/1 var(--display);text-transform:uppercase;color:var(--blue-deep);margin:6px 0 4px}
.plan .big-t em{font-style:normal;color:var(--pink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{min-width:0;overflow:hidden;border-radius:14px;padding:10px 2px;text-align:center;background:rgba(255,255,255,.45);border:1px solid var(--glass-bd);font-size:12px;font-weight:700;color:var(--muted)}
.wd b{display:block;font:700 20px var(--display);color:var(--ink);margin:2px 0 6px}
.wd .st{display:block;font-size:11px}
.wd.done{background:var(--blue);color:#fff;border-color:transparent}.wd.done b{color:#fff}
.wd.done.t-pull{background:var(--pink)}.wd.done.t-legs{background:var(--ink)}
.wd.missed{border:1.5px dashed var(--pink);color:var(--pink)}
.wd.today{outline:2px solid var(--blue);outline-offset:2px}
.wd.skipped{opacity:.55}
.list{display:grid;gap:8px}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid var(--glass-bd);cursor:pointer;text-align:left;width:100%}
.li:hover{background:rgba(255,255,255,.75)}
.li .d{font:700 18px var(--display);min-width:74px;color:var(--blue-deep)}
.li .m{flex:1 1 90px;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font:700 15px var(--display);color:var(--ink)}
.empty{padding:22px;text-align:center;color:var(--muted)}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.cal-head h2{margin:0;font-size:30px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1/1;min-height:46px;border-radius:14px;border:1px solid var(--glass-bd);background:rgba(255,255,255,.4);padding:6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;position:relative}
.day:hover{background:rgba(255,255,255,.75)}
.day .num{font:700 15px var(--display);color:var(--ink)}
.day.out{opacity:.35}
.day .dots{display:flex;gap:4px;flex-wrap:wrap}
.day .dots i{width:11px;height:11px;border-radius:50%;background:var(--blue)}
.day .dots i.t-pull{background:var(--pink)}.day .dots i.t-legs{background:var(--ink)}
.day .dots i.draft{background:transparent;border:2px solid var(--blue)}
.day .dots i.sk{background:#9aa1b5}
.day.missed{border:1.5px dashed var(--pink);background:rgba(210,69,123,.08)}
.day.missed .num{color:var(--pink)}
.day.sched{border-style:dashed;border-color:rgba(43,76,141,.5)}
.day.today{box-shadow:0 0 0 2px var(--blue)}
.day.sel{background:var(--blue);}
.day.sel .num{color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.kpi{padding:16px 18px}
.kpi small{display:block;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi b{display:block;font:700 40px/1.05 var(--display);color:var(--blue-deep);margin-top:6px}
.kpi b em{font-style:normal;color:var(--pink)}
.kpi span{font-size:12px;color:var(--muted)}

/* ---------- exercises ---------- */
.exrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid var(--glass-bd);cursor:pointer;width:100%;text-align:left}
.exrow:hover{background:rgba(255,255,255,.78)}
.exrow .nm{flex:1;min-width:0}
.exrow .nm b{display:block;font-weight:700}
.exrow .nm span{font-size:12px;color:var(--muted)}
.exrow .pr{font:700 20px var(--display);color:var(--pink);text-align:right}
.exrow .pr small{display:block;font:600 11px var(--body);color:var(--muted)}
.exrow.arch{opacity:.5}
.group-t{font:700 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--blue-deep);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.chart{width:100%;height:auto;display:block}
.chart text{font:600 10.5px var(--body);fill:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px}
table.t td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
table.t td.n{font:700 15px var(--display);white-space:nowrap}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,33,61,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}
.modal .glass{width:min(480px,100%);padding:22px;max-height:90vh;overflow:auto;background:rgba(246,244,236,.82)}
.modal h2{font-size:26px;color:var(--blue-deep);margin-bottom:16px}
.fld{margin-bottom:14px}
.tg{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;padding:14px 18px;border-radius:16px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:.25s;font-weight:600}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--pink)}

/* ---------- mobile ---------- */
@media (max-width:1100px){.split{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:899px){
  #app{display:block;padding:44px 16px 120px}
  .nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));top:auto;height:auto;max-height:none;z-index:40;flex-direction:row;justify-content:space-between;padding:6px;border-radius:24px;gap:2px}
  .nav .logo,.nav .sp,.nav .note{display:none}
  .nav button{flex:1;flex-direction:column;gap:3px;padding:8px 2px;font-size:10.5px;border-radius:18px;align-items:center;text-align:center}
  .nav button svg{width:22px;height:22px}
  .g2{grid-template-columns:1fr}
  .head h1{font-size:44px}
  .card{padding:16px}
  .plan{padding:20px}
  .bg .blue{height:300px}
  .bg .word{top:22vh;right:-12vw;font-size:62vw;opacity:.95}
  .day{min-height:42px;padding:5px;border-radius:12px}
  .day .dots i{width:8px;height:8px}
  .sticky-bar{bottom:calc(88px + env(safe-area-inset-bottom))}
  .kpi b{font-size:32px}
}
@media (max-width:420px){.sticky-bar{gap:8px;padding:10px}.sticky-bar .btn{padding:10px 12px;font-size:14px}.cnt{min-width:44px}.wd .st{font-size:10px}.plan .big-t{font-size:34px}.cal{gap:4px}.week{gap:5px}.wd b{font-size:17px}.set{gap:6px}.li .d{min-width:62px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const weekStart = s => { const d=fromIso(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const MON = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

const WDL = ['Неділя','Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота'];
const fmtD = s => { const d=fromIso(s); return `${d.getDate()} ${MONS[d.getMonth()]}`; };
const fmtDY = s => `${fmtD(s)} ${fromIso(s).getFullYear()}`;
const fmtDW = s => `${WD[fromIso(s).getDay()]}, ${fmtD(s)}`;

const KEY='gymlog-v1';
const Store = {
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('gymlog',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(){
    try{ const d=await this.open(); return await new Promise((res,rej)=>{ const q=d.transaction('kv').objectStore('kv').get(KEY); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
    catch(e){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){ return null; } }
  },
  async set(v){
    try{ const d=await this.open(); await new Promise((res,rej)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,KEY); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
    catch(e){ try{ localStorage.setItem(KEY,JSON.stringify(v)); }catch(_){ } }
  }
};

const cache=new Map();
const jx=x=>JSON.stringify({...x,updatedAt:0});
function rebuildCache(){ cache.clear(); [...db.sessions,...db.exercises].forEach(x=>cache.set(x.id,jx(x))); }
function stamp(){
  const now=Date.now(); db.deleted ||= {}; const seen=new Set();
  for(const x of [...db.sessions,...db.exercises]){ seen.add(x.id); const j=jx(x); if(cache.get(x.id)!==j){ x.updatedAt=now; cache.set(x.id,j); } }
  for(const id of [...cache.keys()]) if(!seen.has(id)){ db.deleted[id]=now; cache.delete(id); }
}
function save(now){ stamp(); clearTimeout(saveT); Sync.sched(); if(now) return Store.set(db); saveT=setTimeout(()=>Store.set(db),250); }

/* =====================  derived data  ===================== */
function derive(){
  const done = db.sessions.filter(s=>s.status==='done').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const byDate = {}; db.sessions.forEach(s=>(byDate[s.date] ||= []).push(s));
  const exMap = Object.fromEntries(db.exercises.map(e=>[e.id,e]));
  const hist = {}; done.forEach(s=>s.entries.forEach(en=>(hist[en.ex] ||= []).push({date:s.date,sets:en.sets,sid:s.id})));
  const first = {}; done.forEach(s=>{ if(!first[s.day]||s.date<first[s.day]) first[s.day]=s.date; });
  return {done,byDate,exMap,hist,first};
}
const vol = sets => sets.reduce((a,s)=>a+(s.w||0)*(s.r||0),0);
const topW = sets => sets.reduce((a,s)=>Math.max(a,s.w||0),0);
const e1rm = (w,r) => w>0&&r>0 ? w*(1+r/30) : 0;
function fmtSets(sets){
  const out=[]; let cur=null;
  sets.forEach(s=>{ if(cur&&cur.w===s.w) cur.r.push(s.r); else { cur={w:s.w,r:[s.r]}; out.push(cur);} });
  return out.map(g=>(g.w!=null? `${kg(g.w)} кг: `:'')+g.r.join(' · ')).join(' | ');
}
function lastFor(exId,date,exceptSid){
  const h=(D.hist[exId]||[]).filter(x=>x.sid!==exceptSid && x.date<=date);
  return h[h.length-1]||null;
}
function schedType(date){ return db.settings.schedule[fromIso(date).getDay()]||null; }
function slotStatus(date,type){
  const today=iso(new Date());
  const ws=weekStart(date);
  for(let i=0;i<7;i++){ const d=addDays(ws,i); for(const s of D.byDate[d]||[]) if(s.day===type && s.status==='done') return 'done'; }
  if((D.byDate[date]||[]).some(s=>s.status==='skipped' && s.day===type)) return 'skipped';
  if(date>today) return 'future';
  if(date===today) return 'today';
  if(!D.first[type] || date<D.first[type]) return 'pre';
  return 'missed';
}
function monthStats(y,m){
  const last=iso(new Date(y,m+1,0)); let done=0,missed=0,skipped=0,total=0;
  D.done.forEach(s=>{ if(s.date.startsWith(`${y}-${pad(m+1)}`)) total++; });
  for(let d=`${y}-${pad(m+1)}-01`; d<=last; d=addDays(d,1)){
    const t=schedType(d); if(!t) continue; const st=slotStatus(d,t);
    if(st==='done')done++; else if(st==='missed')missed++; else if(st==='skipped')skipped++;
  }
  const den=done+missed+skipped;
  return {total,done,missed,skipped,pct:den?Math.round(done/den*100):null};
}

/* =====================  session ops  ===================== */
function mkSession(date,type){
  const s={id:uid(),date,day:type,status:'draft',entries:[]};
  const exs=db.exercises.filter(e=>e.day===type&&!e.archived).sort((a,b)=>a.order-b.order);
  exs.forEach(e=>s.entries.push(prefill(e,date,s.id)));
  return s;
}
function prefill(e,date,sid){
  const l=lastFor(e.id,date,sid);
  let sets;
  if(l&&l.sets.length){
    const work=l.sets.filter(x=>x.w>0||e.bodyweight);
    const src=(work.length?work:l.sets).slice(0,6);
    sets=src.map(x=>({w:x.w,r:x.r,done:false}));
  } else sets=[1,2,3].map(()=>({w:e.bodyweight?null:null,r:null,done:false}));
  return {ex:e.id,sets};
}
function startSession(date,type){
  closeModal();
  const s=mkSession(date,type); db.sessions.push(s); ui.editId=s.id; ui.tab='train'; save(); render(); scrollTo(0,0);
}
function skipSlot(date,type){
  db.sessions.push({id:uid(),date,day:type,status:'skipped',entries:[]}); save(); render();
}
function sessionById(id){ return db.sessions.find(s=>s.id===id); }
function finishSession(s){
  s.entries.forEach(e=>{ e.sets=e.sets.filter(x=>x.done&&x.r>0); });
  s.entries=s.entries.filter(e=>e.sets.length);
  if(!s.entries.length){ if(confirm('У тренуванні немає виконаних підходів. Видалити його?')){ db.sessions=db.sessions.filter(x=>x.id!==s.id); ui.editId=null; save(); render(); } else { s.entries=[]; } return; }
  const prior=derive(); const prs=[];
  s.entries.forEach(e=>{ const h=(prior.hist[e.ex]||[]).filter(x=>x.sid!==s.id&&x.date<s.date); if(!h.length) return; const prev=Math.max(...h.map(x=>topW(x.sets))); const cur=topW(e.sets); if(cur>prev&&prev>0) prs.push(`${prior.exMap[e.ex]?.name} — ${kg(cur)} кг`); });
  s.status='done'; ui.editId=null; save(true); render(); scrollTo(0,0);
  toast(`Збережено · обʼєм <b>${Math.round(vol(s.entries.flatMap(e=>e.sets))).toLocaleString('uk-UA')} кг</b>`+(prs.length?`<br>🏆 Рекорд: ${esc(prs.join('; '))}`:''));
}

function viewCal(){
  if(!ui.month){ const n=new Date(); ui.month={y:n.getFullYear(),m:n.getMonth()}; }
  const {y,m}=ui.month; const today=iso(new Date());
  const first=new Date(y,m,1); const lead=(first.getDay()+6)%7; const dim=new Date(y,m+1,0).getDate();
  const st=monthStats(y,m);
  let cells=''; const startD=addDays(iso(first),-lead); const n=Math.ceil((lead+dim)/7)*7;
  for(let i=0;i<n;i++){
    const d=addDays(startD,i); const inM=fromIso(d).getMonth()===m; const ss=D.byDate[d]||[]; const t=schedType(d);
    let cls='day'+(inM?'':' out')+(d===today?' today':'')+(ui.sel===d?' sel':'');
    if(t&&!ss.some(s=>s.status==='done')){ const q=slotStatus(d,t); if(q==='missed') cls+=' missed'; else if(q==='future'||q==='today') cls+=' sched'; }
    const dots=ss.map(s=>s.status==='done'?`<i class="t-${s.day}" title="${TYPES[s.day].name}"></i>`:s.status==='draft'?'<i class="draft"></i>':'<i class="sk" title="Пропуск"></i>').join('');
    cells+=`<button class="${cls}" data-act="selDay" data-d="${d}"><span class="num">${fromIso(d).getDate()}</span><span class="dots">${dots}</span></button>`;

      <div class="muted" style="font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;margin:10px 0 8px">Додати на цей день</div>
      <div class="row wrap">${Object.keys(TYPES).map(k=>`<button class="btn sm ghost" data-act="start" data-type="${k}" data-date="${ui.sel}">${TYPES[k].short}</button>`).join('')}
      ${t&&!ss.length?`<button class="btn sm danger" data-act="skip" data-type="${t}" data-date="${ui.sel}">Пропуск</button>`:''}</div></div>`;
  }
  return head('Історія',`${MON[m]} <em>${y}</em>`) + `<div class="grid split"><div class="card glass">
    <div class="cal-head"><div class="row"><button class="btn sm ghost" data-act="calPrev">‹</button><button class="btn sm ghost" data-act="calNext">›</button></div>

    </div><div class="grid">

/* ---- exercises ---- */
function exStats(e){ const h=D.hist[e.id]||[]; const pr=h.reduce((a,x)=>Math.max(a,topW(x.sets)),0); return {n:h.length,last:h[h.length-1],pr}; }
function chart(points,opt={}){
  if(points.length<2) return '<div class="empty">Замало даних для графіка</div>';
  const W=640,H=250,L=40,R=14,T=14,B=28;
  const xs=points.map(p=>fromIso(p.d).getTime()); const minX=Math.min(...xs), maxX=Math.max(...xs);
  const ys=points.map(p=>p.y); let minY=Math.min(...ys), maxY=Math.max(...ys); if(minY===maxY){minY-=1;maxY+=1;} const padY=(maxY-minY)*.12; minY=Math.max(0,minY-padY); maxY+=padY;
  const X=t=>L+(maxX===minX?0:(t-minX)/(maxX-minX))*(W-L-R), Y=v=>T+(1-(v-minY)/(maxY-minY))*(H-T-B);
  const path=points.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area=`${path} L${X(xs[xs.length-1]).toFixed(1)},${H-B} L${X(xs[0]).toFixed(1)},${H-B}Z`;
  let grid=''; for(let i=0;i<=4;i++){ const v=minY+(maxY-minY)*i/4, y=Y(v); grid+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="rgba(20,33,61,.12)"/><text x="${L-6}" y="${y+3.5}" text-anchor="end">${Math.round(v*10)/10}</text>`; }
  let xl=''; const yrs=[]; for(let i=0;i<=4;i++){ const t=minX+(maxX-minX)*i/4; const d=new Date(t); xl+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${MONS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</text>`; }
  const dots=points.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.6" fill="${opt.color||'#2B4C8D'}" stroke="#fff" stroke-width="1.5"><title>${fmtDY(p.d)}: ${p.t}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid}${xl}<path d="${area}" fill="${opt.color||'#2B4C8D'}" opacity=".10"/><path d="${path}" fill="none" stroke="${opt.color||'#2B4C8D'}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function viewEx(){

  const groups=Object.keys(TYPES).map(k=>{

      <div class="pr">${s.pr?kg(s.pr):'—'}<small>${s.pr?'рекорд, кг':''}</small></div></button>`; }).join('')}</div>`; }).join('');

function viewExDetail(e){
  if(!e){ ui.exId=null; return viewEx(); }
  const h=D.hist[e.id]||[]; const s=exStats(e);
  const cut = ui.range==='all'?'0000': iso(new Date(Date.now()-({'3m':92,'6m':183,'1y':365}[ui.range])*864e5));
  const hh=h.filter(x=>x.date>=cut);
  const pts = ui.metric==='w'
    ? hh.map(x=>({d:x.date,y:topW(x.sets),t:`${kg(topW(x.sets))} кг`})).filter(p=>p.y>0)
    : ui.metric==='v' ? hh.map(x=>({d:x.date,y:Math.round(vol(x.sets)),t:`${Math.round(vol(x.sets))} кг`}))
    : hh.map(x=>{ const b=Math.max(...x.sets.map(z=>e1rm(z.w,z.r))); return {d:x.date,y:Math.round(b*10)/10,t:`${Math.round(b*10)/10} кг`}; }).filter(p=>p.y>0);
  const bestE=h.reduce((a,x)=>Math.max(a,...x.sets.map(z=>e1rm(z.w,z.r))),0);
  return head(`<a href="#" data-act="closeEx" style="color:inherit">← Вправи</a>`, esc(e.name), `${TYPES[e.day].name}${e.perSide?' · вага на кожну':''}${e.bodyweight?' · власна вага':''}`) + `
    <div class="grid g3" style="margin-bottom:18px"><div class="kpi glass"><small>Рекорд ваги</small><b>${s.pr?kg(s.pr)+'<em> кг</em>':'—'}</b></div>
      <div class="kpi glass"><small>Розрах. 1RM</small><b>${bestE?Math.round(bestE)+'<em> кг</em>':'—'}</b><span>формула Епплі</span></div>

      <div class="sp1"></div><div class="seg">${[['3m','3м'],['6m','6м'],['1y','1р'],['all','Все']].map(([k,l])=>`<button class="${ui.range===k?'on':''}" data-act="range" data-id="${k}">${l}</button>`).join('')}</div></div>
      ${chart(pts,{color:ui.metric==='e'?'#D2457B':'#2B4C8D'})}</div>
    <div class="row wrap" style="margin:18px 0"><button class="btn ghost" data-act="editEx" data-id="${e.id}">Редагувати вправу</button></div>
    <div class="card glass"><h2>Журнал <small>${h.length}</small></h2><table class="t"><thead><tr><th>Дата</th><th>Підходи</th><th>Обʼєм</th></tr></thead><tbody>
      ${h.slice().reverse().slice(0,40).map(x=>`<tr><td class="n">${fmtDY(x.date)}</td><td>${fmtSets(x.sets)}</td><td class="n">${Math.round(vol(x.sets))}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---- progress ---- */
function viewProg(){
  const today=iso(new Date()); const wsNow=weekStart(today);
  const weeks={}; D.done.forEach(s=>{ const w=weekStart(s.date); (weeks[w] ||= {push:0,pull:0,legs:0})[s.day]++; });
  // streak: consecutive weeks (back from this/prev week) with ≥1 session
  let streak=0; let w=wsNow; if(!weeks[w]) w=addDays(w,-7); while(weeks[w]){ streak++; w=addDays(w,-7); }
  let best=0,run=0; const allW=Object.keys(weeks).sort(); if(allW.length){ let p=allW[0]; for(const k of allW){ run=(k===addDays(p,7)||k===p)?run+1:1; p=k; best=Math.max(best,run); } }
  const totalSets=D.done.reduce((a,s)=>a+s.entries.reduce((b,e)=>b+e.sets.length,0),0);
  const tonn=D.done.reduce((a,s)=>a+vol(s.entries.flatMap(e=>e.sets)),0);
  // bars: last 26 weeks
  const N=26; const bars=[]; for(let i=N-1;i>=0;i--){ const k=addDays(wsNow,-7*i); bars.push({k,...(weeks[k]||{push:0,pull:0,legs:0})}); }
  const W=640,H=220,L=26,B=26,T=10, bw=(W-L-8)/N; const mx=Math.max(3,...bars.map(b=>b.push+b.pull+b.legs));
  const Y=v=>T+(1-v/mx)*(H-T-B);
  let svg=''; for(let i=0;i<=mx;i++){ svg+=`<line x1="${L}" x2="${W-8}" y1="${Y(i)}" y2="${Y(i)}" stroke="rgba(20,33,61,.1)"/><text x="${L-6}" y="${Y(i)+3.5}" text-anchor="end">${i}</text>`; }
  bars.forEach((b,i)=>{ let y0=H-B; const x=L+i*bw+2; [['push','#2B4C8D'],['pull','#D2457B'],['legs','#14213D']].forEach(([k,c])=>{ if(!b[k]) return; const h=(H-T-B)*b[k]/mx; y0-=h; svg+=`<rect x="${x}" y="${y0}" width="${bw-4}" height="${h-1.5}" rx="3" fill="${c}"><title>${fmtD(b.k)}: ${TYPES[k].short} ${b[k]}</title></rect>`; });
    if(i%5===0) svg+=`<text x="${x}" y="${H-8}">${fmtD(b.k)}</text>`; });
  // PR feed
  const best_={}; const prs=[]; D.done.forEach(s=>s.entries.forEach(e=>{ const t=topW(e.sets); if(t<=0) return; if(best_[e.ex]!==undefined && t>best_[e.ex]) prs.push({d:s.date,ex:e.ex,w:t,prev:best_[e.ex]}); if(best_[e.ex]===undefined||t>best_[e.ex]) best_[e.ex]=t; }));
  const pr=prs.slice(-8).reverse();
  const yr=new Date().getFullYear(); const byYear={}; D.done.forEach(s=>{ const y=s.date.slice(0,4); byYear[y]=(byYear[y]||0)+1; });
  return head('Статистика','Про<em>грес</em>') + `
   <div class="grid g3" style="margin-bottom:18px">
     <div class="kpi glass"><small>Серія тижнів</small><b>${streak}<em> тиж</em></b><span>рекорд ${best}</span></div>
     <div class="kpi glass"><small>Усього тренувань</small><b>${D.done.length}</b><span>${totalSets.toLocaleString('uk-UA')} підходів</span></div>
     <div class="kpi glass"><small>Піднято сумарно</small><b>${Math.round(tonn/1000).toLocaleString('uk-UA')}<em> т</em></b><span>вага × повтори</span></div></div>
   <div class="grid split"><div class="card glass"><h2>Тренувань на тиждень <small>26 тижнів</small></h2><svg class="chart" viewBox="0 0 ${W} ${H}">${svg}</svg></div>
   <div class="grid"><div class="card glass"><h2>Нові рекорди</h2><div class="list">${pr.map(p=>`<button class="li" data-act="openEx" data-id="${p.ex}"><span class="d">${fmtD(p.d)}</span><span class="m">${esc(D.exMap[p.ex]?.name)}</span><span class="v">${kg(p.w)} кг</span></button>`).join('')||'<div class="empty">Поки немає</div>'}</div></div>
   <div class="card glass"><h2>За роками</h2>${Object.keys(byYear).sort().map(y=>`<div class="row" style="padding:5px 0"><b style="font:700 18px var(--display);width:52px">${y}</b><div class="prog"><i style="width:${byYear[y]/Math.max(...Object.values(byYear))*100}%;background:var(--blue)"></i></div><span style="width:34px;text-align:right;font-weight:700">${byYear[y]}</span></div>`).join('')}</div></div></div>`;
}

   <div class="card glass" style="grid-column:1/-1"><h2>Єдина база (GitHub) <small id="syncstat">${Sync.label()}</small></h2>
     <div class="muted" style="margin-bottom:14px">Дані зберігаються у файлі <b>data.json</b> у твоєму приватному репозиторії. Одне й те саме підключення вводиш на кожному пристрої.</div>
     <div class="grid g2" style="gap:12px"><div><label class="f">Репозиторій (власник/назва)</label><input type="text" id="s-repo" placeholder="username/gym-data" value="${esc(Sync.cfg()?.repo||'')}"></div>
     <div><label class="f">Токен (fine-grained, Contents: read/write)</label><input type="password" id="s-token" placeholder="github_pat_…" value="${esc(Sync.cfg()?.token||'')}"></div>
     <div><label class="f">Файл</label><input type="text" id="s-path" value="${esc(Sync.cfg()?.path||'data.json')}"></div>
     <div><label class="f">Гілка (необовʼязково)</label><input type="text" id="s-branch" placeholder="main" value="${esc(Sync.cfg()?.branch||'')}"></div></div>
     <div class="row wrap" style="margin-top:14px"><button class="btn" data-act="syncSave">Підключити й синхронізувати</button><button class="btn ghost" data-act="syncNow">Синхронізувати зараз</button><button class="btn danger" data-act="syncOff">Відключити</button></div></div>
   <div class="card glass"><h2>Небезпечна зона</h2><div class="muted" style="margin-bottom:14px">Повернути базу до стану імпорту з таблиці. Усі нові записи буде втрачено.</div><button class="btn danger" data-act="reset">Скинути до історії з таблиці</button></div></div>`;
}
function download(name,type,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

/* ---- modal: exercise form ---- */
function exModal(id){
  const e=id?D.exMap[id]:{id:null,name:'',day:'push',perSide:false,bodyweight:false,archived:false};
  ui.modal={id};
  $('#modal').innerHTML=`<div class="modal" data-act="mbg"><div class="glass"><h2>${id?'Редагувати вправу':'Нова вправа'}</h2>
    <div class="fld"><label class="f">Назва</label><input type="text" id="m-name" value="${esc(e.name)}"></div>
    <div class="fld"><label class="f">Блок</label><select id="m-day">${Object.keys(TYPES).map(k=>`<option value="${k}" ${e.day===k?'selected':''}>${TYPES[k].name}</option>`).join('')}</select></div>
    <label class="tg"><input type="checkbox" id="m-ps" ${e.perSide?'checked':''}> Вага вказується на кожну гантелю/сторону</label>
    <label class="tg"><input type="checkbox" id="m-bw" ${e.bodyweight?'checked':''}> Власна вага (кг необовʼязково)</label>
    ${id?`<label class="tg"><input type="checkbox" id="m-ar" ${e.archived?'checked':''}> В архіві (не додається в нові тренування)</label>`:''}
    <div class="row" style="margin-top:18px"><button class="btn" data-act="mSave">Зберегти</button><button class="btn ghost" data-act="mClose">Скасувати</button></div></div></div>`;
  setTimeout(()=>$('#m-name')?.focus(),50);
}

/* =====================  render  ===================== */
function render(){
  D=derive(); renderNav();
  const v={train:viewTrain,cal:viewCal,ex:viewEx,prog:viewProg,data:viewData}[ui.tab];
  const y=scrollY; $('#view').innerHTML=v(); scrollTo(0,y);
  document.body.querySelector('.bg .word').textContent={train:'PUSH',cal:'DAYS',ex:'SETS',prog:'GAINS',data:'DATA'}[ui.tab];
}

/* =====================  events  ===================== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(act==='mbg'){ if(e.target===a) closeModal(); return; }
  if(a.tagName==='A') e.preventDefault();
  const s=ui.editId?sessionById(ui.editId):null; const ei=+a.dataset.e, si=+a.dataset.s;
  switch(act){
    case 'tab': ui.tab=a.dataset.id; if(ui.tab!=='train') {} ui.exId=null; render(); scrollTo(0,0); break;
    case 'start': startSession(a.dataset.date,a.dataset.type); break;
    case 'startPick': { const today=iso(new Date()); $('#modal').innerHTML=`<div class="modal" data-act="mbg"><div class="glass"><h2>Яке тренування?</h2><div class="list">${Object.keys(TYPES).map(k=>`<button class="btn ghost" data-act="start" data-type="${k}" data-date="${today}">${TYPES[k].name}</button>`).join('')}</div></div></div>`; break; }
    case 'skip': skipSlot(a.dataset.date,a.dataset.type); break;
    case 'open': { const x=sessionById(a.dataset.id); if(x){ ui.editId=x.id; ui.tab='train'; render(); scrollTo(0,0);} break; }
    case 'back': if(s&&s.status==='draft'&&!s.entries.some(e=>e.sets.some(z=>z.done))){ /* keep draft */ } ui.editId=null; render(); break;
    case 'tick': { const st=s.entries[ei].sets[si]; st.done=!st.done; if(st.done&&!(st.r>0)){ st.done=false; toast('Вкажи кількість повторів'); } save(); render(); break; }
    case 'addSet': { const sets=s.entries[ei].sets; const l=sets[sets.length-1]; sets.push({w:l?l.w:null,r:l?l.r:null,done:false}); save(); render(); break; }
    case 'delSet': s.entries[ei].sets.splice(si,1); save(); render(); break;
    case 'delEntry': s.entries.splice(ei,1); save(); render(); break;
    case 'finish': finishSession(s); break;
    case 'discard': if(confirm(s.status==='draft'?'Скасувати тренування?':'Видалити це тренування назавжди?')){ db.sessions=db.sessions.filter(x=>x.id!==s.id); ui.editId=null; save(true); render(); } break;
    case 'calPrev': { let {y,m}=ui.month; m--; if(m<0){m=11;y--;} ui.month={y,m}; render(); break; }
    case 'calNext': { let {y,m}=ui.month; m++; if(m>11){m=0;y++;} ui.month={y,m}; render(); break; }
    case 'calToday': { const n=new Date(); ui.month={y:n.getFullYear(),m:n.getMonth()}; ui.sel=iso(n); render(); break; }
    case 'selDay': ui.sel=a.dataset.d; { const d=fromIso(ui.sel); ui.month={y:d.getFullYear(),m:d.getMonth()}; } render(); if(innerWidth<900) setTimeout(()=>scrollTo({top:document.querySelector('.split .grid')?.offsetTop+300||0,behavior:'smooth'}),30); break;
    case 'openEx': ui.exId=a.dataset.id; ui.tab='ex'; render(); scrollTo(0,0); break;
    case 'closeEx': ui.exId=null; render(); break;
    case 'metric': ui.metric=a.dataset.id; render(); break;
    case 'range': ui.range=a.dataset.id; render(); break;
    case 'newEx': exModal(null); break;
    case 'editEx': exModal(a.dataset.id); break;
    case 'mClose': closeModal(); break;
    case 'mSave': saveEx(); break;
    case 'expJson': download(`gymlog-${iso(new Date())}.json`,'application/json',JSON.stringify(db,null,1)); break;
    case 'expCsv': { const rows=['date,block,exercise,set,weight_kg,reps']; D.done.forEach(s=>s.entries.forEach(e=>e.sets.forEach((z,i)=>rows.push([s.date,s.day,'"'+(D.exMap[e.ex]?.name||e.ex).replace(/"/g,'""')+'"',i+1,z.w??'',z.r].join(','))))); download(`gymlog-sets-${iso(new Date())}.csv`,'text/csv',rows.join('\n')); break; }
    case 'syncSave': { const c={repo:$('#s-repo').value.trim(),token:$('#s-token').value.trim(),path:$('#s-path').value.trim()||'data.json',branch:$('#s-branch').value.trim()}; if(!/^[^/\s]+\/[^/\s]+$/.test(c.repo)||!c.token){ toast('Вкажи репозиторій у форматі власник/назва і токен'); break; } localStorage.setItem(Sync.K,JSON.stringify(c)); Sync.sha=null; Sync.run(); break; }
    case 'syncNow': Sync.run(); break;
    case 'syncOff': localStorage.removeItem(Sync.K); Sync.set('off'); render(); break;
    case 'reset': if(confirm('Точно скинути все до історії з таблиці? Нові записи зникнуть.')){ db=fresh(); ui.editId=null; save(true); render(); toast('Базу скинуто'); } break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target; const f=t.dataset.f; if(!f) return; const s=ui.editId?sessionById(ui.editId):null;
  if(f==='w'||f==='r'){ const st=s.entries[+t.dataset.e].sets[+t.dataset.s]; st[f]=num(t.value); if(f==='r'&&st.done&&!(st.r>0)){ st.done=false; t.closest('.set').classList.remove('done'); } save(); }
});
document.addEventListener('change',e=>{
  const t=e.target; const f=t.dataset.f; if(!f) return; const s=ui.editId?sessionById(ui.editId):null;
  if(f==='date'&&s&&t.value){ s.date=t.value; save(); render(); }
  else if(f==='day'&&s){ s.day=t.value; save(); render(); }
  else if(f==='addEx'&&s&&t.value){
    let id=t.value;
    if(id==='__new'){ const n=prompt('Назва нової вправи'); if(!n){ render(); return; } const ex={id:'ex'+uid(),name:n.trim(),day:s.day,order:db.exercises.length,perSide:false,bodyweight:false,aliases:[],archived:false}; db.exercises.push(ex); id=ex.id; D=derive(); }
    s.entries.push(prefill(D.exMap[id]||db.exercises.find(x=>x.id===id),s.date,s.id)); save(); render();
  }
  else if(f==='sched'){ const d=+t.dataset.d; if(t.value) db.settings.schedule[d]=t.value; else delete db.settings.schedule[d]; db.settings.updatedAt=Date.now(); save(true); render(); }
  else if(f==='import'&&t.files[0]){ t.files[0].text().then(x=>{ try{ const j=JSON.parse(x); if(!j.exercises||!j.sessions) throw 0; if(confirm(`Замінити поточну базу імпортованою (${j.sessions.length} записів)?`)){ db={v:1,settings:{schedule:{...DEF_SCHEDULE}},deleted:{},...j}; save(true); render(); toast('Імпортовано'); } }catch(_){ alert('Це не схоже на файл експорту Gym Log.'); } }); }
});
function closeModal(){ $('#modal').innerHTML=''; ui.modal=null; }
function saveEx(){
  const name=$('#m-name').value.trim(); if(!name){ $('#m-name').focus(); return; }
  const id=ui.modal.id; const o={name,day:$('#m-day').value,perSide:$('#m-ps').checked,bodyweight:$('#m-bw').checked};
  if(id){ Object.assign(db.exercises.find(x=>x.id===id),o,{archived:$('#m-ar').checked}); }
  else db.exercises.push({id:'ex'+uid(),order:db.exercises.length,aliases:[],archived:false,...o});
  save(true); closeModal(); render();
}

/* =====================  sync (GitHub repo as database)  ===================== */
function mergeInto(r){
  const del={...(db.deleted||{})}; for(const k in (r.deleted||{})) del[k]=Math.max(del[k]||0,r.deleted[k]);
  const mergeList=(a,b)=>{ const m=new Map(); [...a,...b].forEach(x=>{ const o=m.get(x.id); if(!o||(x.updatedAt||0)>(o.updatedAt||0)) m.set(x.id,x); }); return [...m.values()].filter(x=>!(del[x.id]>(x.updatedAt||0))); };
  db.sessions=mergeList(db.sessions,r.sessions||[]); db.exercises=mergeList(db.exercises,r.exercises||[]); db.deleted=del;
  if((r.settings?.updatedAt||0)>(db.settings.updatedAt||0)) db.settings=r.settings;
  rebuildCache();
}
const canon=x=>JSON.stringify({e:[...x.exercises].sort((a,b)=>a.id<b.id?-1:1),s:[...x.sessions].sort((a,b)=>a.id<b.id?-1:1),d:x.deleted||{},t:x.settings});
const Sync={
  K:'gymlog-sync', st:'off', msg:'', sha:null, busy:false, again:false, t:null, last:null,
  cfg(){ try{ return JSON.parse(localStorage.getItem(this.K)||'null'); }catch(e){ return null; } },
  on(){ const c=this.cfg(); return !!(c&&c.token&&c.repo); },
  url(c){ return `https://api.github.com/repos/${c.repo}/contents/${c.path||'data.json'}${c.branch?'?ref='+encodeURIComponent(c.branch):''}`; },
  hdr(c,x){ return {Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...x}; },
  set(st,msg){ this.st=st; this.msg=msg; const n=document.getElementById('syncnote'); if(n) n.textContent=this.label(); const d=document.getElementById('syncstat'); if(d) d.textContent=this.label(); },
  label(){ return !this.on()?'Синхронізація вимкнена':this.st==='sync'?'Синхронізація…':this.st==='err'?'Помилка: '+this.msg:this.last?'Синхронізовано '+this.last:'Підключено'; },
  async pull(c){
    const r=await fetch(this.url(c),{headers:this.hdr(c),cache:'no-store'});
    if(r.status===404){ this.sha=null; return null; }
    if(r.status===401||r.status===403) throw new Error('токен не підходить або немає доступу ('+r.status+')');
    if(!r.ok) throw new Error('GitHub '+r.status);
    const j=await r.json(); this.sha=j.sha; let txt;
    if(j.content) txt=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),ch=>ch.charCodeAt(0)));
    else txt=await (await fetch(this.url(c),{headers:this.hdr(c,{Accept:'application/vnd.github.raw+json'}),cache:'no-store'})).text();
    return JSON.parse(txt);
  },
  async push(c){
    const bytes=new TextEncoder().encode(JSON.stringify(db)); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    const body={message:'gymlog sync '+new Date().toISOString(),content:btoa(bin)}; if(this.sha) body.sha=this.sha; if(c.branch) body.branch=c.branch;
    const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${c.path||'data.json'}`,{method:'PUT',headers:this.hdr(c,{'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(r.status===409||r.status===422) return 'conflict';
    if(!r.ok) throw new Error('GitHub '+r.status);
    this.sha=(await r.json()).content.sha; return 'ok';
  },
  sched(){ if(!this.on()) return; clearTimeout(this.t); this.t=setTimeout(()=>this.run(),3000); },
  async run(){
    const c=this.cfg(); if(!c||!c.token||!c.repo) return;
    if(this.busy){ this.again=true; return; } this.busy=true; clearTimeout(this.t); this.set('sync');
    try{
      for(let i=0;i<4;i++){
        const remote=await this.pull(c); let same=false;
        if(remote){ const before=canon(db); mergeInto(remote); same=canon(db)===canon(remote); if(canon(db)!==before){ await Store.set(db); if(!document.activeElement||!/INPUT|SELECT/.test(document.activeElement.tagName)) render(); } }
        if(same) break;
        const res=await this.push(c); if(res==='ok') break;
        if(i===3) throw new Error('конфлікт, спробуй ще раз');
      }
      const n=new Date(); this.last=`${pad(n.getHours())}:${pad(n.getMinutes())}`; this.set('ok');
    }catch(e){ this.set('err',e.message||String(e)); }
    this.busy=false; if(this.again){ this.again=false; this.sched(); }
  }
};
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Sync.on()) Sync.run(); });

/* =====================  boot  ===================== */
(async function(){
  db = await Store.get();
  if(!db||!db.sessions){ db=fresh(); save(true); }
  db.settings ||= {schedule:{...DEF_SCHEDULE}}; db.deleted ||= {};
  rebuildCache(); D=derive();
  const draft=db.sessions.find(s=>s.status==='draft'&&s.date===iso(new Date()));
  if(draft) ui.editId=draft.id;
  render();
  if(Sync.on()) Sync.run();
})();
</script>
